<script>
const PAGE = {key:"ll-hsa-day2-v1", day:"Day 2", title:"How Smart Are Animals?",
  intro:"Today you'll answer questions with text evidence, use your vocabulary words, and learn how science articles are organized and what their text features do.",
  standards:["ELA.K12.EE.1.1 Cite evidence","ELA.6.R.2.1 Text structure & features","ELA.6.V.1.1 Academic vocabulary","ELA.6.V.1.3 Context clues"],
  checklist:[]};
const GROUPS = [{g:"all", title:"Today's Locks", note:"Go in order from Lock 1 to Lock 4."}];
const STATIONS = [
{ id:"evidence", std:["ELA.K12.EE.1.1"], g:"all", color:"#2a9d8f", title:"Answer with Text Evidence", blurb:"Prove it with the text",
  learn:[
   {h:"Prove it!", html:`<p><span class="term">Text evidence</span> is information from the text that proves your answer. Good readers don't just answer. They <b>show where</b> the answer comes from.</p>
   <p>Use <b>RACE</b> to build a strong answer:</p>
   <ul><li><b>R</b>estate the question in your answer.</li><li><b>A</b>nswer the question.</li><li><b>C</b>ite evidence from the text.</li><li><b>E</b>xplain how the evidence proves your answer.</li></ul>`},
   {h:"Ways to cite evidence", html:`<ul><li><b>Quote</b>: use the author's exact words in quotation marks. <i>The author states, "…"</i></li>
   <li><b>Paraphrase</b>: tell the evidence in your own words. <i>According to the text, …</i></li></ul>
   <div class="chips"><div class="chip">According to the text, …</div><div class="chip">The author states, "…"</div><div class="chip">In paragraph ___, …</div><div class="chip">This shows that …</div></div>`}
  ],
  example:{q:`Question: Why did people think Hans was clever? (Use the passage you'll read next.)`,a:`<b>R + A:</b> People thought Hans was clever because he seemed to solve math problems. <b>C:</b> According to the text, "the horse tapped his hoof to give the answer." <b>E:</b> This shows that people believed Hans understood the questions and could count.`},
  passage:{title:"The Horse Who Seemed to Count",lines:[
   "In the early 1900s, a horse named Hans amazed crowds in Berlin, Germany.",
   "When his owner, a math teacher named Wilhelm von Osten, asked Hans a math question, the horse tapped his hoof to give the answer.",
   "Hans seemed to add, subtract, and even tell time, so people called him \"Clever Hans.\"",
   "In 1907, a scientist named Oskar Pfungst decided to run an investigation.",
   "He noticed that Hans answered correctly only when the questioner knew the answer and Hans could see that person.",
   "Pfungst figured out that people relaxed their faces and bodies, without meaning to, when Hans reached the right number, so Hans stopped tapping.",
   "Hans could not really do math, but he was very good at observing tiny human movements.",
   "Today, scientists design animal tests carefully so they don't give accidental clues. This problem is called the Clever Hans effect."]},
  qs:[
   {t:"tap",d:1,q:"Tap the sentence that tells <b>when</b> the investigation began.",a:3,hint:"Look for a year.",why:"The text says the investigation began in 1907."},
   {t:"tap",d:2,q:"Tap the sentence that is the BEST evidence that Hans could <b>not</b> really do math.",a:6,hint:"Find the sentence that says it directly.",why:"This sentence directly states Hans couldn't do math and explains what he was really doing."},
   {t:"mc",d:2,q:"Which evidence BEST supports the idea that Hans was reading people's body language?",opts:["\"a horse named Hans amazed crowds in Berlin\"","\"Hans answered correctly only when the questioner knew the answer and Hans could see that person\"","\"people called him 'Clever Hans'\"","\"In 1907, a scientist named Oskar Pfungst decided to run an investigation\""],a:1,hint:"Which detail shows Hans needed to SEE the person?",why:"Hans only got it right when he could see someone who knew the answer, which proves he was reading people."},
   {t:"mc",d:1,q:"Which sentence starter shows you are citing text evidence?",opts:["I think that…","According to the text,…","My favorite part is…","Once upon a time…"],a:1,hint:"Which starter points back to the text?",why:"'According to the text' shows the information comes from the passage."},
   {t:"mc",d:2,q:"What lesson did scientists learn from Clever Hans?",opts:["Horses are better at math than people.","Animal tests must be designed so people don't give accidental clues.","Scientists should never study horses.","Math is too hard to test."],a:1,hint:"Reread the last sentence.",why:"The last sentence says scientists now design tests carefully to avoid giving clues."},
   {t:"mc",d:2,q:"Which answer uses ALL four parts of RACE to answer <b>How did Oskar Pfungst figure out Hans's secret?</b>",opts:["Hans was a horse.","Pfungst figured it out by observing Hans.","Pfungst figured out Hans's secret by observing carefully. According to the text, Hans answered correctly only when he could see a questioner who knew the answer. This shows Hans was reading people's body movements.","I think Hans was smart."],a:2,hint:"Look for Restate, Answer, Cite (According to the text), and Explain (This shows).",why:"Choice C restates, answers, cites evidence with 'According to the text,' and explains with 'This shows.'"}
  ]},
{ id:"vocab", std:["ELA.6.V.1.1", "ELA.6.V.1.3"], g:"all", color:"#7b4fd6", title:"Vocabulary in Action", blurb:"Use the concept words",
  learn:[
   {h:"Your six science words", html:`<div class="chips">
   <div class="chip"><b>evaluate</b> = to judge how good, useful, or true something is</div>
   <div class="chip"><b>observing</b> = watching carefully to learn something</div>
   <div class="chip"><b>investigation</b> = a careful study to find out the facts</div>
   <div class="chip"><b>phenomenon</b> = something that happens that people can observe</div>
   <div class="chip"><b>interpret</b> = to explain the meaning of something</div>
   <div class="chip"><b>measurable</b> = able to be measured or counted</div></div>
   <div class="tip">Notice how all six words show up in the Clever Hans story: Pfungst ran an <b>investigation</b>, spent time <b>observing</b>, and had to <b>interpret</b> a strange <b>phenomenon</b>.</div>`}
  ],
  qs:[
   {t:"mc",d:1,q:`Complete the sentence: "A horse that seemed to do math was a puzzling ________ that people wanted to explain."`,opts:["phenomenon","measurable","evaluate","observing"],a:0,hint:"Which word means something surprising people can observe?",why:"Phenomenon means something people can observe that is often surprising."},
   {t:"mc",d:2,q:`Complete the sentence: "Scientists want results that are ________, like counting how many seconds it takes a crow to solve a puzzle."`,opts:["interpret","measurable","investigation","phenomenon"],a:1,hint:"Counting seconds is a way of measuring.",why:"Results you can count or time are measurable."},
   {t:"mc",d:2,q:`Complete the sentence: "Before using a website for my essay, I will ________ whether it's reliable."`,opts:["observing","phenomenon","evaluate","measurable"],a:2,hint:"Which word means to judge how good something is?",why:"Evaluate means to judge whether something is good, useful, or true."},
   {t:"mc",d:2,q:`Complete the sentence: "Pfungst had to ________ Hans's tapping to figure out what it really meant."`,opts:["interpret","measurable","phenomenon","investigation"],a:0,hint:"Which word means to explain the meaning?",why:"To interpret is to figure out what something means."},
   {t:"mc",d:2,q:"Which pair of words are BOTH things a scientist does?",opts:["observing and interpret","phenomenon and measurable","measurable and phenomenon","investigation and phenomenon"],a:0,hint:"Look for two action words (verbs).",why:"Observing and interpreting are both actions scientists do. Phenomenon is a thing, and measurable describes something."}
  ]},
{ id:"patterns", std:["ELA.6.R.2.1"], g:"all", color:"#2c7be5", title:"Organizational Patterns", blurb:"How science articles are built",
  learn:[
   {h:"Patterns authors use", html:`<ul>
   <li><span class="term">Chronological</span>: events in time order. <i>first, in 1907, later, today</i></li>
   <li><span class="term">Cause and effect</span>: why something happens and what results. <i>because, so, as a result</i></li>
   <li><span class="term">Compare and contrast</span>: how things are alike and different. <i>both, similarly, however, unlike</i></li>
   <li><span class="term">Problem and solution</span>: a problem and how it's solved. <i>problem, to solve this, one solution</i></li>
   <li><span class="term">Question and answer</span>: asks a question, then answers it. Common in science articles! <i>How…? Why…? Scientists found…</i></li>
   <li><span class="term">Description</span>: details about one thing. <i>for example, such as</i></li></ul>`},
   {h:"Why it matters", html:`<p>The pattern helps you understand <b>how the ideas connect</b>. When you know the pattern, you know what to look for.</p>
   <div class="tip">A whole article can use more than one pattern. "How Smart Are Animals?" asks a big question and answers it with examples from different animals.</div>`}
  ],
  example:{q:`"Can fish use tools? Scientists filmed a wrasse fish smashing a clam against a rock to crack it open." What pattern?`,a:`<b>Question and answer.</b> The author asks a question and then answers it with evidence from scientists.`},
  qs:[
   {t:"mc",d:1,passage:`In the early 1900s, Hans amazed crowds. In 1907, Oskar Pfungst began his investigation. Later, he discovered Hans's secret. Today, scientists still talk about the Clever Hans effect.`,q:"Which organizational pattern does this paragraph use?",opts:["compare and contrast","chronological","problem and solution","description"],a:1,hint:"Look at the time words.",why:"In the early 1900s, in 1907, later, and today show chronological (time) order."},
   {t:"mc",d:2,passage:`Because octopuses have no bones, they can squeeze through tiny openings. As a result, some aquarium octopuses have escaped from their tanks at night.`,q:"Which organizational pattern does this paragraph use?",opts:["cause and effect","question and answer","chronological","compare and contrast"],a:0,hint:"Look for because and as a result.",why:"Because and as a result signal cause and effect: no bones lets them squeeze through, so they escape."},
   {t:"mc",d:2,passage:`Both dogs and wolves can follow a scent trail. However, dogs are much better at understanding when a person points at something, while wolves usually ignore pointing.`,q:"Which organizational pattern does this paragraph use?",opts:["problem and solution","compare and contrast","chronological","cause and effect"],a:1,hint:"Notice both and however.",why:"Both shows a similarity and however shows a difference, so it's compare and contrast."},
   {t:"mc",d:2,passage:`Scientists had a problem: tests of animal intelligence were sometimes ruined by accidental clues from people. To solve this, researchers now often stay hidden or use machines to give animals the tests.`,q:"Which organizational pattern does this paragraph use?",opts:["description","problem and solution","question and answer","chronological"],a:1,hint:"Notice the words problem and to solve this.",why:"The paragraph names a problem (accidental clues) and a solution (staying hidden or using machines)."},
   {t:"mc",d:2,q:"Why do many science articles use a <b>question and answer</b> pattern?",opts:["to make readers curious and then explain what scientists found","to tell a made-up story","to list events in time order","to give the author's opinion"],a:0,hint:"Science starts with questions!",why:"Asking a question hooks readers' curiosity, and answering it explains the research, just like real science."}
  ]},
{ id:"features", std:["ELA.6.R.2.1"], g:"all", color:"#e76f51", title:"Text Features", blurb:"Headings, captions, diagrams & more",
  learn:[
   {h:"Text features are helpers", html:`<p><span class="term">Text features</span> are parts of a text that help you find and understand information.</p>
   <ul><li><b>Title and headings</b>: tell the topic of the article and of each section.</li>
   <li><b>Bold words</b>: important vocabulary, often defined nearby or in a glossary.</li>
   <li><b>Photos and captions</b>: show what's described; the caption explains the photo.</li>
   <li><b>Diagrams</b>: labeled drawings that show parts or steps.</li>
   <li><b>Charts and graphs</b>: show data and numbers.</li>
   <li><b>Sidebars</b>: boxes with extra, related information.</li>
   <li><b>Glossary</b>: a mini dictionary at the end.</li></ul>`}
  ],

const NOTES={"cover": "<p>Review yesterday: What makes a science article different from a memoir? Take 2 quick answers. Then read today's \u201cI can\u201d statements.</p>", "end": "<p>Quick check: students write one RACE sentence on a sticky note or whiteboard: \u201cAccording to the text, ___.\u201d</p>", "evidence": {"intro": "<p>Build Insight questions need text evidence. Today we practice RACE with a short science passage about a famous horse.</p>", "learn": ["<p>Write R-A-C-E down the side of the board. Have students make the matching hand motion for each letter if you use one.</p>", "<p>Show the difference: a <b>quote</b> uses quotation marks with exact words; a <b>paraphrase</b> uses your own words.</p>"], "example": "<p>Color-code the model answer on the board: R+A in one color, C in another, E in a third.</p>"}, "vocab": {"intro": "<p>Quick vocabulary practice before the vocabulary assignment.</p>", "learn": ["<p>Ask students to find each vocabulary word in the Clever Hans story (Pfungst's investigation, observing, interpret, phenomenon).</p>"]}, "patterns": {"intro": "<p>Science articles use organizational patterns. Signal words are the keys.</p>", "learn": ["<p>Students copy the signal words into their notebooks. Add <b>question and answer</b>; it's very common in science articles.</p>", "<p>Ask: Which pattern do you think \u201cHow Smart Are Animals?\u201d uses most? Revisit after reading.</p>"], "example": "<p>Circle the question mark and the word <i>Scientists</i>. Ask: what pattern does that show?</p>"}, "features": {"intro": "<p>Text features help readers find and understand information.</p>", "learn": ["<p>Have students page through the selection in Realize and point to one text feature from the list.</p>"], "example": "<p>Ask: Is the octopus fact part of the main text or a bonus? That's how you know it's a sidebar.</p>"}};


/* ======== BUILD SLIDES ======== */
const KEY_SVG = c => `<svg class="bigkey" viewBox="0 0 64 64" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="none" stroke="${c}" stroke-width="7"/><path d="M29 31 L54 56 M44 46 L50 40 M49 51 L55 45" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`;

const allStd=[...new Set(STATIONS.flatMap(s=>s.std||[]))];

  if(s.example) SLIDES.push({sec:s.title,color:s.color,kind:"example",s,notes:N.example||"Model your thinking out loud before you reveal the answer. Point to the clue words as you think."});
  s.qs.forEach((q,i)=>SLIDES.push({sec:s.title,color:s.color,kind:"q",s,q,i,notes:qNotes(q)}));
  SLIDES.push({sec:s.title,color:s.color,kind:"key",s,si,notes:"Celebrate! Ask: What is one thing you'll remember from this part of the lesson?"});
});
SLIDES.push({sec:"Wrap-Up",color:"#f2b705",kind:"end",notes:NOTES.end});

function qNotes(q){
  let ans="";
  if(q.t==="mc") ans="ABCDE"[q.a]+". "+q.opts[q.a];
  else if(q.t==="multi") ans=q.a.map(k=>"ABCDE"[k]).join(", ");
  else if(q.t==="tap") ans="Sentence "+(q.a+1);
  else if(q.t==="order") ans=q.items.join(" → ");
  else ans="See the model answer (reveal on the slide).";
  return `<p><b>${q.d===1?"DOK 1 (recall)":"DOK 2 (skill/concept)"}</b></p><p><b>Answer:</b> ${ans}</p>${q.hint?`<p><b>If students are stuck, prompt:</b> ${q.hint}</p>`:""}${q.why?`<p><b>Why:</b> ${q.why}</p>`:""}`;
}

/* ======== STATE (saved on this device) ======== */
let S={i:0,rev:{}};
try{ const r=localStorage.getItem(PAGE.key+"-teach"); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}

/* ======== RENDER ======== */
const slideEl=document.getElementById("slide");
function passageOf(s,q){
  if(q && q.passage) return `<div class="passage">${q.passage}</div>`;
  if(s.passageHtml) return s.passageHtml;
  if(s.passage) return `<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<p style="margin:0 0 6px"><b style="color:var(--muted)">${k+1}</b> ${l}</p>`).join("")}</div>`;
  return "";
}
function render(anim=true){
  stopDrawingSave();
  const sl=SLIDES[S.i]; const s=sl.s;
  slideEl.style.setProperty("--c",sl.color);
  document.getElementById("brandTitle").textContent=`${PAGE.title} · ${PAGE.day}`;
  document.getElementById("secLabel").innerHTML=sl.s?`Part <b>${sl.si!==undefined?sl.si+1:STATIONS.indexOf(s)+1}</b> of ${STATIONS.length} · ${sl.sec}`:sl.sec;

  if(sl.kind==="cover"){
    h=`<div class="cover">${KEY_SVG("#c98f00")}<div class="day">${PAGE.day}</div><h1>${PAGE.title}</h1><p style="font-size:1.05em">${PAGE.selection}</p>
    <h3 style="margin-top:.6em;font-size:1.2em">Today, I can…</h3><div class="cando">${PAGE.cando.map(c=>`<div>${c}</div>`).join("")}</div>${stdBox(allStd)}</div>`;
  } else if(sl.kind==="divider"){

  } else if(sl.kind==="learn"){
    h=`<span class="tag">I do · Learn it</span><h2>${sl.l.h}</h2>${sl.l.html}`;
  } else if(sl.kind==="example"){
    const r=S.rev[S.i];
    h=`<span class="tag">We do · Think it through</span><h2>Let's try one together</h2><p class="q">${s.example.q}</p>
    <div class="reveal-row"><button class="btn dark" id="revealBtn" ${r?"hidden":""}>Reveal the thinking</button></div>
    <div class="answer" id="ans" ${r?"":"hidden"}><b class="big">How a locksmith thinks:</b>${s.example.a}</div>`;
  } else if(sl.kind==="q"){
    const q=sl.q, r=S.rev[S.i];
    const pass=(q.t!=="write"||q.passage||s.passage||s.passageHtml)?passageOf(s,q):"";
    let body=`<span class="tag">You do · Check ${sl.i+1} of ${s.qs.length}</span><br><span class="respond">${RESPOND[q.t]}</span><p class="q">${q.q}</p>`;
    if(q.t==="mc"||q.t==="multi") body+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div>`;
    if(q.t==="order") body+=`<div class="opts">${q.items.map((t,k)=>({t,k})).sort((a,b)=>((a.k*7+3)%q.items.length)-((b.k*7+3)%q.items.length)).map(o=>`<div class="opt" data-k="${o.k}"><span class="ltr">?</span><span>${o.t}</span></div>`).join("")}</div>`;
    if(q.t==="write") body+=`<div class="starters">${q.starters.map(t=>`<span>${t}</span>`).join("")}</div>`;
    body+=`<div class="reveal-row"><button class="btn dark" id="revealBtn" ${r?"hidden":""}>${q.t==="write"?"Show a model answer":"Reveal answer"}</button></div><div id="fb"></div>`;

    if(q.t==="tap"){ tapPass=`<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<button class="tapline" data-k="${k}"><b style="color:var(--muted)">${k+1}</b> ${l}</button>`).join("")}</div>`; }
    h=tapPass?`<div class="split two"><div>${tapPass}</div><div>${body}</div></div>`:body;
  } else if(sl.kind==="key"){
    h=`<div class="divider">${KEY_SVG(s.color)}<span class="num">Part ${sl.si+1} complete</span><h2>Key unlocked: ${s.title}!</h2><p style="font-size:1.1em">${pick(["Great work, readers! One more key on our ring.","You did it! That's how locksmiths work: one key at a time.","Amazing thinking today, class!"])}</p></div>`;
  } else if(sl.kind==="end"){
    h=`<div class="cover">${KEY_SVG("#c98f00")}<div class="day">${PAGE.day} complete!</div><h1>You unlocked every key!</h1>
    <h3 style="margin-top:.6em;font-size:1.2em">Look back: Today, I can…</h3><div class="cando">${PAGE.cando.map(c=>`<div>${c}</div>`).join("")}</div>
    ${PAGE.checklist.length?`<div class="tip"><b>Due today:</b> ${PAGE.checklist.join(" · ")}</div>`:""}
    ${PAGE.next?`<div class="tip"><b>Next:</b> ${PAGE.next}</div>`:""}</div>`;
  }
  slideEl.innerHTML=h;
  if(anim){ slideEl.classList.remove("enter"); void slideEl.offsetWidth; slideEl.classList.add("enter"); }
  slideEl.scrollTop=0;
  document.getElementById("count").textContent=`${S.i+1} / ${SLIDES.length}`;
  document.getElementById("barFill").style.width=((S.i)/(SLIDES.length-1)*100)+"%";
  document.getElementById("prev").disabled=S.i===0;

  const n=document.getElementById("notes"); n.innerHTML=`<h4>Teacher notes</h4>${/^</.test(sl.notes||"")?sl.notes:`<p>${sl.notes||""}</p>`}`;

}

function markRevealed(sl){
  const q=sl.q;
  S.rev[S.i]=true; save();
  const rb=document.getElementById("revealBtn"); if(rb) rb.hidden=true;
  if(sl.kind==="example"){ document.getElementById("ans").hidden=false; popConfetti(); return; }
  if(q.t==="mc") slideEl.querySelectorAll(".opt").forEach(b=>{ if(+b.dataset.k===q.a) b.classList.add("right"); });
  if(q.t==="multi") slideEl.querySelectorAll(".opt").forEach(b=>{ if(q.a.includes(+b.dataset.k)) b.classList.add("right"); });
  if(q.t==="tap") slideEl.querySelectorAll(".tapline").forEach(b=>{ if(+b.dataset.k===q.a) b.classList.add("right"); });
  if(q.t==="order"){ const box=slideEl.querySelector(".opts"); box.innerHTML=q.items.map((t,k)=>`<div class="opt right"><span class="ltr">${k+1}</span><span>${t}</span></div>`).join(""); }
  const fb=document.getElementById("fb");
  if(q.t==="write") fb.innerHTML=`<div class="answer"><b class="big">Model answer</b>${q.model}<p style="margin-top:8px"><i>Check: Does your answer have these key ideas?</i></p></div>`;
  else fb.innerHTML=`<div class="answer"><b class="big">${pick(PRAISE)} ✨</b>${q.why}</div>`;
  popConfetti();
}
function wire(sl){
  const rb=document.getElementById("revealBtn");
  if(sl.kind==="example"){ if(rb) rb.onclick=()=>markRevealed(sl); return; }
  if(sl.kind!=="q") return;
  const q=sl.q;
  if(S.rev[S.i]){ markRevealedQuiet(sl); }
  if(rb) rb.onclick=()=>markRevealed(sl);
  // teacher can tap a class answer to check it
  if(q.t==="mc"||q.t==="tap"){
    slideEl.querySelectorAll(q.t==="mc"?".opt":".tapline").forEach(b=>b.onclick=()=>{
      if(S.rev[S.i]) return;
      if(+b.dataset.k===q.a){ markRevealed(sl); toast(pick(PRAISE)); }
      else { b.classList.add("wrong"); document.getElementById("fb").innerHTML=`<div class="hintbox"><b>Not quite. Try again!</b> 💡 ${q.hint}</div>`; }
    });
  }
  if(q.t==="multi"){
    slideEl.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(S.rev[S.i]) return;
      const k=+b.dataset.k;
      if(q.a.includes(k)){ b.classList.add("right"); const all=q.a.every(x=>slideEl.querySelector(`.opt[data-k="${x}"]`).classList.contains("right")); if(all){ markRevealed(sl); toast("Found them all!"); } else toast("Yes! Find another."); }
      else { b.classList.add("wrong"); document.getElementById("fb").innerHTML=`<div class="hintbox"><b>Not that one.</b> 💡 ${q.hint}</div>`; }
    });
  }
}
function markRevealedQuiet(sl){ const c=window.confetti; window.confetti=null; markRevealed(sl); window.confetti=c; }

/* ======== PEN (Apple Pencil / finger) ======== */
const cv=document.getElementById("pen"), ctx=cv.getContext("2d"); let penColor="#e0245e", drawing=false, last=null; const ink={};
function sizeCanvas(){ const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const keep=cv.width?cv.toDataURL():null; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap="round"; ctx.lineJoin="round"; if(keep){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=keep; } }
window.addEventListener("resize",sizeCanvas);
function savePen(){ try{ ink[S.i]=cv.toDataURL(); }catch(e){} }
function stopDrawingSave(){}
function restorePen(){ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); if(ink[S.i]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=ink[S.i]; } }
cv.addEventListener("pointerdown",e=>{ drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.strokeStyle=penColor; ctx.lineWidth=e.pressure&&e.pointerType==="pen"?3+e.pressure*6:5; ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{ drawing=false; savePen(); }));
function pt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
document.getElementById("penBtn").onclick=()=>{ document.body.classList.toggle("drawing"); document.getElementById("penBtn").classList.toggle("on",document.body.classList.contains("drawing")); };
document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{ penColor=s.dataset.c; });
document.getElementById("clearPen").onclick=()=>{ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); delete ink[S.i]; };

/* ======== CELEBRATION ======== */
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function popConfetti(){ if(window.confetti) confetti({particleCount:90,spread:80,origin:{y:.7},colors:["#f2b705","#2a9d8f","#e76f51","#7b4fd6","#2c7be5"]}); }
function bigConfetti(){ if(!window.confetti) return; const end=Date.now()+1800; (function f(){ confetti({particleCount:6,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:6,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:150,spread:110,origin:{y:.55}}); }

if(S.i>=SLIDES.length) S.i=0;
sizeCanvas(); render(false);
